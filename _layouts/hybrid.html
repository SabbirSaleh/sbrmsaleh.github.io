<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#341b56">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}Sabbir Muhammad Saleh</title>
<link rel="stylesheet" href="{{ '/assets/css/hybrid.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<button class="menu-toggle" id="hybrid-menu" type="button" aria-controls="hybrid-sidebar" aria-expanded="false">☰ Menu</button>
<aside class="hybrid-sidebar" id="hybrid-sidebar" aria-label="Primary sidebar">
 <a class="identity" href="{{ '/' | relative_url }}">
 <span class="avatar" aria-hidden="true">SMS</span><strong>{{ site.data.hybrid_profile.short_name }}</strong>
 <small>{{ site.data.hybrid_profile.tagline }}</small><span>Western University · Canada</span>
 </a>
 <nav class="hybrid-nav" aria-label="Main">
 {% for link in site.data.hybrid_navigation.main %}
 <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}class="active" aria-current="page"{% endif %}>{{ link.title }}</a>
 {% endfor %}
 </nav>
 <div class="sidebar-foot"><a href="mailto:{{ site.data.hybrid_profile.email }}">Email</a> · <a href="{{ site.data.hybrid_profile.scholar }}" target="_blank" rel="noopener noreferrer">Scholar</a> · <a href="{{ site.data.hybrid_profile.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></div>
</aside>
<div class="site-content">
<main id="main" class="page-body" tabindex="-1">{{ content }}</main>
<footer class="foot"><span>© 2026 Sabbir Muhammad Saleh</span><a href="{{ '/cv/' | relative_url }}">Contact</a></footer>
</div>
<script src="{{ '/assets/js/hybrid.js' | relative_url }}" defer></script>
</body>
</html>
