---
layout: hybrid
---
<p class="eyebrow">{{ page.kind }} · {{ page.year }}</p>
<h1>{{ page.title }}</h1>
<p class="intro">{{ page.authors }}</p>
<p>{{ page.venue }}</p>
<p><span class="pill">{{ page.status }}</span></p>
{% if page.doi %}<p><a class="button" href="https://doi.org/{{ page.doi }}" target="_blank" rel="noopener noreferrer">Publisher DOI ↗</a></p>{% endif %}
<div class="entry-body">{{ content }}</div>
<p><a href="{{ '/publications/' | relative_url }}">← Publications</a></p>
