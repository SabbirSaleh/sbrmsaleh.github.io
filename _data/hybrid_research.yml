- name: "Secure CI/CD and DevSecOps"
  detail: "Stage-aware security controls, monitoring and evidence across build, test, package, deploy and runtime."
- name: "Software supply-chain security"
  detail: "Dependencies, third-party integrations, signing, registries, policies and delivery provenance."
- name: "Security evidence engineering"
  detail: "Requirements-to-evidence traceability, provenance, evidence sufficiency, digest verification and explainable assurance."
- name: "AI-assisted security analytics"
  detail: "Topic modelling, anomaly detection, log processing and human-centred triage; detections are signals, not confirmed compromise."
- name: "Cloud-native security"
  detail: "Container, API, identity, cloud platform and runtime security."
- name: "Software architecture and evaluation"
  detail: "Architecture-level security constraints, conformance, evidence drift and empirical evaluation."
